<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatz Display - Jugendfeuerwehr Leeste</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --green-color: #2e7d32;
            --red-color: #c62828;
            --yellow-color: #f57f17;
            --blue-color: #1976d2;
            --default-color: #2b2b2b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-top: 20px;
            padding-bottom: 30px;
            margin-bottom: 25px;
            position: relative;
            min-height: 90px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-height: 95px;
            margin-top: 10px;
            margin-bottom: 10px;
            width: auto;
            object-fit: contain;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background-color: #333;
        }

        .status-active {
            background-color: var(--green-color);
            color: #fff;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid var(--green-color);
            flex-wrap: wrap;
            gap: 15px;
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .badge-yes { color: #4cd137; }
        .badge-no { color: #ff4d4d; }
        .badge-other { color: #fbc531; }
        .special-stat { color: #00d2d3; margin-left: 10px; }

        .time-counter {
            font-size: 1.4rem;
            font-weight: 600;
            color: #dcdde1;
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px 20px;
            border-radius: 10px;
            background-color: var(--default-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 8px solid #666;
            transition: transform 0.2s ease;
        }

        .card.status-green {
            border-left-color: #4cd137;
            background-color: #112e12;
        }

        .card.status-red {
            border-left-color: #ff4d4d;
            background-color: #2e1111;
            opacity: 0.4;
        }

        .card.status-yellow {
            border-left-color: #fbc531;
            background-color: #2e2a11;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .state-tag {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            text-transform: uppercase;
            font-weight: bold;
        }

        .free-text {
            font-size: 0.9rem;
            color: #fbc531;
            background: rgba(251, 197, 49, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-style: italic;
        }

        .tags {
            font-size: 0.85rem;
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.15);
            font-size: 0.75rem;
            font-weight: bold;
        }
        .tag-yellow { background-color: #f57f17; color: #000; }
        .tag-red { background-color: #c62828; color: #fff; }
        .tag-blue { background-color: #1976d2; color: #fff; }

        .no-alarm {
            text-align: center;
            padding: 100px 20px;
            color: #777;
            font-size: 1.8rem;
        }

        @media (max-width: 950px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
            .logo-container { position: static; transform: none; margin: 20px 0; }
            h1 { font-size: 1.5rem; }
            .info-bar { flex-direction: column; gap: 15px; text-align: center; }
            .counter-container, .time-counter { font-size: 1.1rem; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Einsatzkräfte auf Anfahrt</h1>
        <div class="logo-container">
            <img src="logo.png" alt="Logo">
        </div>
        <div id="status" class="status-badge">Warten auf Einsatz...</div>
    </header>

    <div id="alarm-content" style="display: none;">
        <div class="info-bar">
            <div class="counter-container">
                <span>Zusagen: <strong id="count-yes" class="badge-yes">0</strong></span>
                <span>|</span>
                <span>Absagen: <strong id="count-no" class="badge-no">0</strong></span>
                <span>|</span>
                <span>Sonstige: <strong id="count-other" class="badge-other">0</strong></span>
                <span class="special-stat">| AGT: <strong id="count-agt">0</strong></span>
                <span class="special-stat">| MA: <strong id="count-ma">0</strong></span>
                <span class="special-stat">| Kettensäge: <strong id="count-ks">0</strong></span>
            </div>
            <div class="time-counter" id="timer-container">Dauer: <span id="timer">00:00</span></div>
        </div>
        <div id="person-grid" class="grid"></div>
    </div>

    <div id="no-alarm-message" class="no-alarm">
        Kein aktiver Einsatz
    </div>

    <script>
        let alarmStartTime = null;

        function getCardStatusClass(state) {
            if (state === 'YES' || state === 'HERE') return 'status-green';
            if (state === 'NO' || state === 'ABSENT') return 'status-red';
            return 'status-yellow';
        }

        function getTagClass(func) {
            const f = String(func).toLowerCase();
            if (f.includes('ortsbm') || f.includes('ortsbrandmeister')) return 'tag-yellow';
            if (f.includes('zugführer') || f.includes('zf')) return 'tag-red';
            if (f.includes('gruppenführer') || f.includes('gf')) return 'tag-blue';
            return ''; 
        }

        setInterval(() => {
            if (!alarmStartTime) return;
            const elapsedSeconds = Math.floor((Date.now() - alarmStartTime) / 1000);
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }, 1000);

        async function updateDisplay() {
            try {
                const response = await fetch('/api/current-alarm');
                const data = await response.json();

                const statusEl = document.getElementById('status');
                const contentEl = document.getElementById('alarm-content');
                const noAlarmEl = document.getElementById('no-alarm-message');
                const gridEl = document.getElementById('person-grid');
                
                const countYesEl = document.getElementById('count-yes');
                const countNoEl = document.getElementById('count-no');
                const countOtherEl = document.getElementById('count-other');
                const countAgtEl = document.getElementById('count-agt');
                const countMaEl = document.getElementById('count-ma');
                const countKsEl = document.getElementById('count-ks');

                if (!data || !data.alarmId) {
                    statusEl.textContent = 'Bereitschaft';
                    statusEl.classList.remove('status-active');
                    contentEl.style.display = 'none';
                    noAlarmEl.style.display = 'block';
                    alarmStartTime = null;
                    return;
                }

                statusEl.textContent = 'EINSATZ AKTIV';
                statusEl.classList.add('status-active');
                contentEl.style.display = 'block';
                noAlarmEl.style.display = 'none';
                alarmStartTime = data.startedAt;

                let persons = data.responses || [];

                persons.sort((a, b) => {
                    const nameA = (a.name || '').toLowerCase();
                    const nameB = (b.name || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                let countYes = 0, countNo = 0, countOther = 0;
                let agtCount = 0, maCount = 0, ksCount = 0;

                persons.forEach(p => {
                    const isYes = (p.state === 'YES' || p.state === 'HERE');
                    const isNo = (p.state === 'NO' || p.state === 'ABSENT');

                    if (isYes) countYes++;
                    else if (isNo) countNo++;
                    else countOther++;

                    if (isYes && p.functions && Array.isArray(p.functions)) {
                        p.functions.forEach(f => {
                            const lower = String(f).toLowerCase();
                            if (lower.includes('agt')) agtCount++;
                            if (lower.includes('ma') || lower.includes('maschinist')) maCount++;
                            if (lower.includes('kettensäge') || lower.includes('ks')) ksCount++;
                        });
                    }
                });

                countYesEl.textContent = countYes;
                countNoEl.textContent = countNo;
                countOtherEl.textContent = countOther;
                countAgtEl.textContent = agtCount;
                countMaEl.textContent = maCount;
                countKsEl.textContent = ksCount;

                gridEl.innerHTML = '';

                persons.forEach(person => {
                    const card = document.createElement('div');
                    const functions = person.functions || [];
                    const statusClass = getCardStatusClass(person.state);

                    card.className = `card ${statusClass}`;
                    
                    const nameRow = document.createElement('div');
                    nameRow.className = 'name-row';

                    const nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = person.name || 'Unbekannt';
                    nameRow.appendChild(nameEl);

                    const stateBadge = document.createElement('span');
                    stateBadge.className = 'state-tag';
                    stateBadge.textContent = person.state || 'UNKNOWN';
                    nameRow.appendChild(stateBadge);

                    card.appendChild(nameRow);

                    if (person.free) {
                        const freeTextEl = document.createElement('div');
                        freeTextEl.className = 'free-text';
                        freeTextEl.textContent = `"${person.free}"`;
                        card.appendChild(freeTextEl);
                    }

                    if (functions.length > 0) {
                        const tagsEl = document.createElement('div');
                        tagsEl.className = 'tags';
                        functions.forEach(f => {
                            const badge = document.createElement('span');
                            badge.className = `tag-badge ${getTagClass(f)}`;
                            badge.textContent = f;
                            tagsEl.appendChild(badge);
                        });
                        card.appendChild(tagsEl);
                    }

                    gridEl.appendChild(card);
                });

            } catch (err) {
                console.error('Verbindungsfehler zum Server:', err);
                setTimeout(() => { location.reload(); }, 10000);
            }
        }

        setInterval(updateDisplay, 5000);
        updateDisplay();
    </script>
</body>
</html>
