<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatz Display - Feuerwehr Leeste</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --green-color: #2e7d32;
            --red-color: #c62828;
            --yellow-color: #f57f17;
            --default-color: #2b2b2b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-top: 20px;
            padding-bottom: 30px;
            margin-bottom: 25px;
            position: relative;
            min-height: 90px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            max-height: 95px;
            margin-top: 10px;
            margin-bottom: 10px;
            width: auto;
            object-fit: contain;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background-color: #333;
        }

        .status-active {
            background-color: var(--green-color);
            color: #fff;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid var(--green-color);
            flex-wrap: wrap;
            gap: 20px;
        }

        .counter-container {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .badge-yes { color: #4cd137; }
        .badge-no { color: #ff4d4d; }
        .badge-other { color: #fbc531; }

        .functions-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            flex: 1;
        }
        .func-item {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .func-count-active {
            color: #4cd137;
            font-weight: bold;
        }

        .time-counter {
            font-size: 1.4rem;
            font-weight: 600;
            color: #dcdde1;
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px 20px;
            border-radius: 10px;
            background-color: var(--default-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 8px solid #666;
            transition: transform 0.2s ease;
            min-height: 50px;
        }

        .card.status-green {
            border-left-color: #4cd137;
            background-color: #112e12;
        }

        .card.status-red {
            border-left-color: #ff4d4d;
            background-color: #2e1111;
            opacity: 0.4;
        }

        .card.status-yellow {
            border-left-color: #fbc531;
            background-color: #2e2a11;
            justify-content: space-between;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
        }

        .free-text {
            font-size: 0.9rem;
            color: #fbc531;
            background: rgba(251, 197, 49, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 6px;
            font-style: italic;
        }

        .no-alarm {
            text-align: center;
            padding: 100px 20px;
            color: #777;
            font-size: 1.8rem;
        }

        @media (max-width: 950px) {
            header { flex-direction: column; gap: 15px; text-align: center; }
            .logo-container { position: static; transform: none; margin: 20px 0; }
            h1 { font-size: 1.5rem; }
            .info-bar { flex-direction: column; gap: 15px; text-align: center; }
            .counter-container, .time-counter { font-size: 1.1rem; justify-content: center; }
            .functions-wrapper { order: 3; width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Einsatzkräfte auf Anfahrt</h1>
        <div class="logo-container">
            <img src="logo.png" alt="Logo">
        </div>
        <div id="status" class="status-badge">Warten auf Einsatz...</div>
    </header>

    <div id="alarm-content" style="display: none;">
        <div class="info-bar">
            <div class="counter-container">
                <span>Zusagen: <strong id="count-yes" class="badge-yes">0</strong></span>
                <span>|</span>
                <span>Absagen: <strong id="count-no" class="badge-no">0</strong></span>
                <span>|</span>
                <span>Sonstige: <strong id="count-other" class="badge-other">0</strong></span>
            </div>

            <div id="functions-container" class="functions-wrapper"></div>
            
            <div class="time-counter" id="timer-container">Dauer: <span id="timer">00:00</span></div>
        </div>
        <div id="person-grid" class="grid"></div>
    </div>

    <div id="no-alarm-message" class="no-alarm">
        Kein aktiver Einsatz
    </div>

    <script>
        let alarmStartTime = null;

        function getCardStatusClass(state) {
            if (state === 'YES' || state === 'HERE') return 'status-green';
            if (state === 'NO' || state === 'ABSENT') return 'status-red';
            return 'status-yellow';
        }

        setInterval(() => {
            if (!alarmStartTime) return;
            const elapsedSeconds = Math.floor((Date.now() - alarmStartTime) / 1000);
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }, 1000);

        async function updateDisplay() {
            try {
                const response = await fetch('/api/current-alarm');
                const data = await response.json();

                const statusEl = document.getElementById('status');
                const contentEl = document.getElementById('alarm-content');
                const noAlarmEl = document.getElementById('no-alarm-message');
                const gridEl = document.getElementById('person-grid');
                
                const countYesEl = document.getElementById('count-yes');
                const countNoEl = document.getElementById('count-no');
                const countOtherEl = document.getElementById('count-other');
                const funcContainer = document.getElementById('functions-container');

                if (!data || !data.alarmId) {
                    statusEl.textContent = 'Bereitschaft';
                    statusEl.classList.remove('status-active');
                    contentEl.style.display = 'none';
                    noAlarmEl.style.display = 'block';
                    alarmStartTime = null;
                    return;
                }

                statusEl.textContent = 'EINSATZ AKTIV';
                statusEl.classList.add('status-active');
                contentEl.style.display = 'block';
                noAlarmEl.style.display = 'none';
                alarmStartTime = data.startedAt;

                funcContainer.innerHTML = '';
                if (data.functions && data.functions.length > 0) {
                    data.functions.forEach(f => {
                        const count = parseInt(f.count) || 0;
                        const span = document.createElement('span');
                        span.className = 'func-item';
                        
                        const countClass = count >= 1 ? 'func-count-active' : '';
                        span.innerHTML = `${f.label}: <span class="${countClass}">${f.count}</span>`;
                        funcContainer.appendChild(span);
                    });
                }

                let persons = data.responses || [];
                persons.sort((a, b) => (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase()));

                let countYes = 0, countNo = 0, countOther = 0;
                persons.forEach(p => {
                    const isYes = (p.state === 'YES' || p.state === 'HERE');
                    const isNo = (p.state === 'NO' || p.state === 'ABSENT');
                    if (isYes) countYes++; else if (isNo) countNo++; else countOther++;
                });

                countYesEl.textContent = countYes;
                countNoEl.textContent = countNo;
                countOtherEl.textContent = countOther;

                gridEl.innerHTML = '';
                persons.forEach(person => {
                    if (person.state === 'NO') return;

                    const card = document.createElement('div');
                    card.className = `card ${getCardStatusClass(person.state)}`;
                    
                    const nameRow = document.createElement('div');
                    nameRow.className = 'name-row';
                    const nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = person.name || 'Unbekannt';
                    nameRow.appendChild(nameEl);
                    card.appendChild(nameRow);

                    if (person.free && person.state === 'UNKNOWN') {
                        const freeTextEl = document.createElement('div');
                        freeTextEl.className = 'free-text';
                        freeTextEl.textContent = `"${person.free}"`;
                        card.appendChild(freeTextEl);
                    }
                    gridEl.appendChild(card);
                });

            } catch (err) {
                console.error('Verbindungsfehler:', err);
                setTimeout(() => { location.reload(); }, 10000);
            }
        }

        setInterval(updateDisplay, 5000);
        updateDisplay();
    </script>
</body>
</html>
