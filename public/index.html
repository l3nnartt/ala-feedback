<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatz Display - Rückmeldungen</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --yellow-color: #ffcc00;
            --red-color: #ff4d4d;
            --blue-color: #3399ff;
            --default-color: #2b2b2b;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background-color: #333;
        }

        .status-active {
            background-color: #2e7d32;
            color: #fff;
        }

        /* Container für Zähler und Uhr */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid #2e7d32;
        }

        .counter {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .time-counter {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--yellow-color);
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px 20px;
            border-radius: 10px;
            background-color: var(--default-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 8px solid #666;
            transition: transform 0.2s ease;
        }

        /* Farbkennzeichnungen nach Funktionen */
        .card.tag-yellow {
            border-left-color: var(--yellow-color);
            background-color: #2a2415;
        }

        .card.tag-red {
            border-left-color: var(--red-color);
            background-color: #2a1515;
        }

        .card.tag-blue {
            border-left-color: var(--blue-color);
            background-color: #122033;
        }

        .name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .tags {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 8px;
        }

        .tag-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.15);
            margin-right: 5px;
            margin-top: 4px;
        }

        .no-alarm {
            text-align: center;
            padding: 100px 20px;
            color: #777;
            font-size: 1.8rem;
        }

        /* Responsive Design für Smartphones & Tablets */
        @media (max-width: 650px) {
            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
            }

            .info-bar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .counter, .time-counter {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Einsatzkräfte auf Anfahrt</h1>
        <div id="status" class="status-badge">Warten auf Einsatz...</div>
    </header>

    <div id="alarm-content" style="display: none;">
        <div class="info-bar">
            <div class="counter">Zusagen: <span id="count">0</span> Person(en)</div>
            <div class="time-counter" id="timer-container">Dauer: <span id="timer">00:00</span></div>
        </div>
        <div id="person-grid" class="grid"></div>
    </div>

    <div id="no-alarm-message" class="no-alarm">
        Kein aktiver Einsatz
    </div>

    <script>
        // Schlüsselwörter für die farbige Randmarkierung
        const YELLOW_TAGS = ['OrtsBM', 'Ortsbrandmeister', 'Stv. OrtsBM'];
        const RED_TAGS = ['Zugführer', 'ZF'];
        const BLUE_TAGS = ['Gruppenführer', 'GF'];
        const WHITE_TAGS = ['Mannschaft', 'FM', 'OFM', 'HFM'];

        let alarmStartTime = null;

        function getCardClass(functions) {
            if (!functions || !Array.isArray(functions)) return '';
            
            const lowerFuncs = functions.map(f => String(f).toLowerCase());

            if (YELLOW_TAGS.some(yt => lowerFuncs.includes(yt.toLowerCase()))) return 'tag-yellow';
            if (RED_TAGS.some(rt => lowerFuncs.includes(rt.toLowerCase()))) return 'tag-red';
            if (BLUE_TAGS.some(bt => lowerFuncs.includes(bt.toLowerCase()))) return 'tag-blue';
            if (WHITE_TAGS.some(wt => lowerFuncs.includes(wt.toLowerCase()))) return '';

            return '';
        }

        // Stoppuhr-Logik (wird jede Sekunde ausgeführt)
        setInterval(() => {
            if (!alarmStartTime) return;
            
            const elapsedSeconds = Math.floor((Date.now() - alarmStartTime) / 1000);
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(elapsedSeconds % 60).padStart(2, '0');
            
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }, 1000);

        async function updateDisplay() {
            try {
                const response = await fetch('/api/current-alarm');
                const data = await response.json();

                const statusEl = document.getElementById('status');
                const contentEl = document.getElementById('alarm-content');
                const noAlarmEl = document.getElementById('no-alarm-message');
                const gridEl = document.getElementById('person-grid');
                const countEl = document.getElementById('count');

                // Wenn kein Alarm aktiv ist
                if (!data || !data.alarmId) {
                    statusEl.textContent = 'Bereitschaft';
                    statusEl.classList.remove('status-active');
                    contentEl.style.display = 'none';
                    noAlarmEl.style.display = 'block';
                    alarmStartTime = null; // Stoppuhr anhalten
                    return;
                }

                // Einsatz aktiv!
                statusEl.textContent = 'EINSATZ AKTIV';
                statusEl.classList.add('status-active');
                contentEl.style.display = 'block';
                noAlarmEl.style.display = 'none';
                
                // Startzeitpunkt für die Stoppuhr übernehmen
                alarmStartTime = data.startedAt;

                // Nur Personen filtern, die zugesagt haben ("state": "YES")
                let comingPersons = (data.responses || []).filter(r => r.state === 'YES');

                // Sortierung: Älteste Zusagen zuerst (chronologisch)
                // FE2 nutzt hierfür oft Felder wie 'timestamp', 'date' oder 'time'
                comingPersons.sort((a, b) => {
                    const timeA = new Date(a.timestamp || a.time || a.date || 0).getTime();
                    const timeB = new Date(b.timestamp || b.time || b.date || 0).getTime();
                    
                    // Fallback: Wenn keine Zeitstempel vorhanden sind, 
                    // behalte die Reihenfolge der FE2-API (diese ist meist chronologisch)
                    if (timeA === 0 && timeB === 0) return 0;
                    
                    return timeA - timeB; 
                });

                countEl.textContent = comingPersons.length;
                gridEl.innerHTML = '';

                comingPersons.forEach(person => {
                    const card = document.createElement('div');
                    const functions = person.functions || [];
                    const colorClass = getCardClass(functions);

                    card.className = `card ${colorClass}`;
                    
                    const nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = person.name || 'Unbekannt';
                    card.appendChild(nameEl);

                    // Qualifikationen / Funktionen anzeigen (z. B. AGT, MA)
                    if (functions.length > 0) {
                        const tagsEl = document.createElement('div');
                        tagsEl.className = 'tags';
                        functions.forEach(f => {
                            const badge = document.createElement('span');
                            badge.className = 'tag-badge';
                            badge.textContent = f;
                            tagsEl.appendChild(badge);
                        });
                        card.appendChild(tagsEl);
                    }

                    gridEl.appendChild(card);
                });

            } catch (err) {
                console.error('Verbindungsfehler zum Server:', err);
                
                // Bei einem Verbindungsabbruch: 10 Sekunden warten und Seite neu laden
                setTimeout(() => {
                    location.reload();
                }, 10000);
            }
        }

        // Display alle 5 Sekunden aktualisieren
        setInterval(updateDisplay, 5000);
        updateDisplay();
    </script>
</body>
</html>
