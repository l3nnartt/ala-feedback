<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einsatz Display - Rückmeldungen</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --yellow-color: #ffcc00;
            --red-color: #ff4d4d;
            --blue-color: #3399ff;
            --default-color: #2b2b2b;
            --gray-color: #444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            background-color: #333;
        }

        .status-active {
            background-color: #2e7d32;
            color: #fff;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: #1e1e1e;
            padding: 15px 20px;
            border-radius: 10px;
            border-left: 5px solid #2e7d32;
        }

        .counter {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .time-counter {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--yellow-color);
            font-variant-numeric: tabular-nums;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            padding: 15px 20px;
            border-radius: 10px;
            background-color: var(--default-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 8px solid #666;
            transition: transform 0.2s ease;
        }

        /* Farbkennzeichnungen nach Funktionen (Priorität) */
        .card.tag-yellow { border-left-color: var(--yellow-color); background-color: #2a2415; }
        .card.tag-red { border-left-color: var(--red-color); background-color: #2a1515; }
        .card.tag-blue { border-left-color: var(--blue-color); background-color: #122033; }

        /* Ausgegraute Karten für Absagen / Abwesenheiten */
        .card.card-inactive {
            opacity: 0.35;
            border-left-color: var(--gray-color) !important;
            background-color: #1a1a1a !important;
        }

        .name-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .state-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            text-transform: uppercase;
        }

        .tags {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 8px;
        }

        .tag-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.15);
            margin-right: 5px;
            margin-top: 4px;
        }

        .no-alarm {
            text-align: center;
            padding: 100px 20px;
            color: #777;
            font-size: 1.8rem;
        }

        @media (max-width: 650px) {
            header, .info-bar { flex-direction: column; gap: 15px; text-align: center; }
            h1 { font-size: 1.5rem; }
            .counter, .time-counter { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Einsatzkräfte auf Anfahrt</h1>
        <div id="status" class="status-badge">Warten auf Einsatz...</div>
    </header>

    <div id="alarm-content" style="display: none;">
        <div class="info-bar">
            <div class="counter">Zusagen: <span id="count">0</span> Person(en)</div>
            <div class="time-counter" id="timer-container">Dauer: <span id="timer">00:00</span></div>
        </div>
        <div id="person-grid" class="grid"></div>
    </div>

    <div id="no-alarm-message" class="no-alarm">
        Kein aktiver Einsatz
    </div>

    <script>
        const YELLOW_TAGS = ['OrtsBM', 'Ortsbrandmeister', 'Stv. OrtsBM'];
        const RED_TAGS = ['Zugführer', 'ZF'];
        const BLUE_TAGS = ['Gruppenführer', 'GF'];

        let alarmStartTime = null;

        // Ermittelt die Priorität für die Sortierung (1 = Gelb, 2 = Rot, 3 = Blau, 4 = Mannschaft)
        function getPriority(functions) {
            if (!functions || !Array.isArray(functions)) return 4;
            const lowerFuncs = functions.map(f => String(f).toLowerCase());

            if (YELLOW_TAGS.some(yt => lowerFuncs.includes(yt.toLowerCase()))) return 1;
            if (RED_TAGS.some(rt => lowerFuncs.includes(rt.toLowerCase()))) return 2;
            if (BLUE_TAGS.some(bt => lowerFuncs.includes(bt.toLowerCase()))) return 3;
            return 4;
        }

        function getCardClass(functions) {
            if (!functions || !Array.isArray(functions)) return '';
            const lowerFuncs = functions.map(f => String(f).toLowerCase());

            if (YELLOW_TAGS.some(yt => lowerFuncs.includes(yt.toLowerCase()))) return 'tag-yellow';
            if (RED_TAGS.some(rt => lowerFuncs.includes(rt.toLowerCase()))) return 'tag-red';
            if (BLUE_TAGS.some(bt => lowerFuncs.includes(bt.toLowerCase()))) return 'tag-blue';
            return '';
        }

        setInterval(() => {
            if (!alarmStartTime) return;
            const elapsedSeconds = Math.floor((Date.now() - alarmStartTime) / 1000);
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }, 1000);

        async function updateDisplay() {
            try {
                const response = await fetch('/api/current-alarm');
                const data = await response.json();

                const statusEl = document.getElementById('status');
                const contentEl = document.getElementById('alarm-content');
                const noAlarmEl = document.getElementById('no-alarm-message');
                const gridEl = document.getElementById('person-grid');
                const countEl = document.getElementById('count');

                if (!data || !data.alarmId) {
                    statusEl.textContent = 'Bereitschaft';
                    statusEl.classList.remove('status-active');
                    contentEl.style.display = 'none';
                    noAlarmEl.style.display = 'block';
                    alarmStartTime = null;
                    return;
                }

                statusEl.textContent = 'EINSATZ AKTIV';
                statusEl.classList.add('status-active');
                contentEl.style.display = 'block';
                noAlarmEl.style.display = 'none';
                alarmStartTime = data.startedAt;

                let persons = data.responses || [];

                // Sortierung: 1. Nach Prio (Gelb -> Rot -> Blau -> Mannschaft), 2. Alphabetisch nach Name
                persons.sort((a, b) => {
                    const prioA = getPriority(a.functions);
                    const prioB = getPriority(b.functions);

                    if (prioA !== prioB) {
                        return prioA - prioB;
                    }

                    // Gleiche Prio -> Alphabetisch nach Name
                    const nameA = (a.name || '').toLowerCase();
                    const nameB = (b.name || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                // Zähle nur echte Zusagen (YES oder HERE)
                const activeCount = persons.filter(p => p.state === 'YES' || p.state === 'HERE').length;
                countEl.textContent = activeCount;
                gridEl.innerHTML = '';

                persons.forEach(person => {
                    const card = document.createElement('div');
                    const functions = person.functions || [];
                    const colorClass = getCardClass(functions);

                    // Prüfen ob Absage oder Abwesenheit
                    const isInactive = person.state === 'NO' || person.state === 'ABSENT';
                    const inactiveClass = isInactive ? 'card-inactive' : '';

                    card.className = `card ${colorClass} ${inactiveClass}`;
                    
                    // Kopfzeile der Karte (Name + Status)
                    const nameRow = document.createElement('div');
                    nameRow.className = 'name-row';

                    const nameEl = document.createElement('div');
                    nameEl.className = 'name';
                    nameEl.textContent = person.name || 'Unbekannt';
                    nameRow.appendChild(nameEl);

                    const stateBadge = document.createElement('div');
                    stateBadge.className = 'state-tag';
                    stateBadge.textContent = person.state || 'UNKNOWN';
                    nameRow.appendChild(stateBadge);

                    card.appendChild(nameRow);

                    // Funktionen / Tags anzeigen
                    if (functions.length > 0) {
                        const tagsEl = document.createElement('div');
                        tagsEl.className = 'tags';
                        functions.forEach(f => {
                            const badge = document.createElement('span');
                            badge.className = 'tag-badge';
                            badge.textContent = f;
                            tagsEl.appendChild(badge);
                        });
                        card.appendChild(tagsEl);
                    }

                    gridEl.appendChild(card);
                });

            } catch (err) {
                console.error('Verbindungsfehler zum Server:', err);
                setTimeout(() => { location.reload(); }, 10000);
            }
        }

        setInterval(updateDisplay, 5000);
        updateDisplay();
    </script>
</body>
</html>
